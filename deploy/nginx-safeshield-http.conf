# HTTP-only — enable this until a Let's Encrypt cert exists.
# Do not symlink from a missing project path. Copy into sites-available:
#   sudo cp deploy/nginx-safeshield-http.conf /etc/nginx/sites-available/safeshieldsolutions
#   sudo ln -sfn /etc/nginx/sites-available/safeshieldsolutions /etc/nginx/sites-enabled/safeshieldsolutions
#
# Do NOT use default_server. Another brand on this VPS would leak traffic.

upstream safeshield_next {
    server 127.0.0.1:3010;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name safeshieldsolutions.in www.safeshieldsolutions.in;

    client_max_body_size 4M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    add_header X-Site-Brand "SafeShield-Solutions" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /_next/static/ {
        proxy_pass http://safeshield_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Site-Brand "SafeShield-Solutions" always;
        access_log off;
    }

    location /images/ {
        proxy_pass http://safeshield_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Site-Brand "SafeShield-Solutions" always;
        access_log off;
    }

    location / {
        proxy_pass http://safeshield_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
