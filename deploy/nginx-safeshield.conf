# Enable (after cert exists):
#   sudo cp deploy/nginx-safeshield.conf /etc/nginx/sites-available/safeshieldsolutions
#   sudo ln -sfn /etc/nginx/sites-available/safeshieldsolutions /etc/nginx/sites-enabled/safeshieldsolutions
#   sudo nginx -t && sudo systemctl reload nginx
# Or: bash deploy/install-nginx.sh
#
# If https://safeshieldsolutions.in opens Deva Safety Nets, this vhost is not
# enabled or the cert is missing and SNI falls through to another default_server.

upstream safeshield_next {
    server 127.0.0.1:3010;
    keepalive 32;
}

# Shared gzip (put in http {} if you prefer global)
# gzip on;
# gzip_vary on;
# gzip_min_length 1024;
# gzip_comp_level 5;
# gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

server {
    listen 80;
    listen [::]:80;
    server_name safeshieldsolutions.in www.safeshieldsolutions.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://safeshieldsolutions.in$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name safeshieldsolutions.in;

    ssl_certificate     /etc/letsencrypt/live/safeshieldsolutions.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/safeshieldsolutions.in/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 4M;
    keepalive_timeout 65;
    keepalive_requests 1000;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml application/wasm;

    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Site-Brand "SafeShield-Solutions" always;

    location /_next/static/ {
        proxy_pass http://safeshield_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /images/ {
        proxy_pass http://safeshield_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering on;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location / {
        proxy_pass http://safeshield_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_buffering on;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.safeshieldsolutions.in;
    ssl_certificate     /etc/letsencrypt/live/safeshieldsolutions.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/safeshieldsolutions.in/privkey.pem;
    return 301 https://safeshieldsolutions.in$request_uri;
}
